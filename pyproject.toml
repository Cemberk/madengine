[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "madengine"
version = "0.1.0"
description = "AI Training Orchestration Engine"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Advanced Micro Devices", email = "mad.support@amd.com"},
]
dependencies = [
    "click>=8.0",
    "omegaconf>=2.3",
    "pydantic>=2.0",
    "pandas",
    "GitPython",
    "jsondiff",
    "sqlalchemy",
    "paramiko",
    "pymysql",
    "tqdm",
    "pytest",
    "typing-extensions",
    "pymongo",
    "toml",
]

[project.optional-dependencies]
mysql = ["sqlalchemy>=2.0", "pymysql>=1.0"]
mongodb = ["pymongo>=4.0"]
all = ["madengine[mysql,mongodb]"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
# Legacy entry point (backwards compatible)
madengine = "madengine.mad:main"
# New orchestrated pipeline entry point
madengine-pipeline = "madengine.cli:main"

[project.urls]
Homepage = "https://github.com/ROCm/madengine"
Issues = "https://github.com/ROCm/madengine/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/madengine"]

[tool.hatch.build.targets.wheel.force-include]
"src/madengine/scripts" = "madengine/scripts"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
